<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoPortal Interativo</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h2>GeoPortal</h2>
                <p>Análise Espacial</p>
            </div>
            
            <div class="sidebar-content">
                <div class="layer-section dropdown">
                    <h3 class="dropdown-header active" onclick="toggleDropdown(this)">
                        <span>Mapas Base</span>
                        <span class="chevron">▼</span>
                    </h3>
                    <div class="dropdown-content radio-group">
                        <label class="custom-radio">
                            <input type="radio" name="basemap" value="light" checked>
                            <span class="radio-mark"></span>
                            Modo Claro (OSM)
                        </label>
                        <label class="custom-radio">
                            <input type="radio" name="basemap" value="satellite">
                            <span class="radio-mark"></span>
                            Satélite (Esri)
                        </label>
                    </div>
                </div>

                <div class="layer-section dropdown">
                    <h3 class="dropdown-header active" onclick="toggleDropdown(this)">
                        <span>Camadas Vetoriais</span>
                        <span class="chevron">▼</span>
                    </h3>
                    <div class="dropdown-content checkbox-group" id="geojson-list">
                        <!-- Gerado dinamicamente -->
                    </div>
                </div>

                <div class="layer-section dropdown">
                    <h3 class="dropdown-header active" onclick="toggleDropdown(this)">
                        <span>Camadas Raster</span>
                        <span class="chevron">▼</span>
                    </h3>
                    <div class="dropdown-content checkbox-group" id="raster-list">
                        <!-- Gerado dinamicamente -->
                    </div>
                </div>
            </div>
            
            <div id="loading" class="loading-indicator">
                <div class="spinner"></div>
                <span id="loading-text">Processando...</span>
            </div>
        </aside>
        
        <main id="map-container">
            <div id="map"></div>
        </main>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <!-- GeoRaster & GeoRaster Layer for Leaflet -->
    <script src="https://unpkg.com/georaster"></script>
    <script src="https://unpkg.com/georaster-layer-for-leaflet"></script>
    
    <!-- Chroma.js for Color scales (useful for rasters) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.4.2/chroma.min.js"></script>

    <!-- Banco de Dados embutido (Sem CORS) -->
    <script src="data_layers.js"></script>
    <script src="main.js"></script>
</body>
</html>
